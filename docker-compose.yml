version: '3.8'

services:
  spiderfoot:
    image: smicallef/spiderfoot
    container_name: spiderfoot
    restart: unless-stopped
    environment:
      - SF_EMAIL=your_email@example.com  # Ganti dengan email Anda
      - SF_PASSWORD=your_strong_password # Ganti dengan password kuat
      - SF_CONSOLE_PORT=5000
    ports:
      - "5000:5000"  # Port HTTP SpiderFoot
    volumes:
      - spiderfoot_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spiderfoot.rule=Host(spiderfoot.local)"
      - "traefik.http.routers.spiderfoot.entrypoints=web"

volumes:
  spiderfoot_data:
